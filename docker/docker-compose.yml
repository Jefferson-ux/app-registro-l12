services:
    app:
        image: laravel-app
        build:
            context: ..
            dockerfile: Dockerfile
        pull_policy: never
        container_name: laravel_app
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - ..:/var/www
            - app_vendor:/var/www/vendor
            - app_storage:/var/www/storage
        environment:
            APP_ENV: production
            APP_DEBUG: "false"
            APP_KEY: ${APP_KEY:?falta APP_KEY}
            APP_PACKAGES_CACHE: /tmp/laravel-packages.php
            APP_SERVICES_CACHE: /tmp/laravel-services.php
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: ${DB_DATABASE:?falta DB_DATABASE}
            DB_USERNAME: ${DB_USERNAME:?falta DB_USERNAME}
            DB_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD}
            MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:?falta MAIL_FROM_ADDRESS}
            MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Registro L12}
            CACHE_STORE: database
            SESSION_DRIVER: database
            QUEUE_CONNECTION: database
            MAIL_MAILER: smtp
            MAIL_HOST: mailpit
            MAIL_PORT: 1025
            MAIL_ENCRYPTION: ""
            SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:?falta SUPER_ADMIN_EMAIL}
        depends_on:
            mysql:
                condition: service_healthy
        networks:
            - laravel

    nginx:
        image: nginx:1.27-alpine
        container_name: laravel_nginx
        restart: unless-stopped
        ports:
            - "8000:80" # en el VPS: "80:80"
        volumes:
            - ../public:/var/www/public:ro
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
        networks:
            - laravel

    mysql:
        image: mysql:8.4
        container_name: laravel_mysql
        restart: unless-stopped
        ports:
            - "3307:3306"
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:?falta DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME:?falta DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?falta DB_ROOT_PASSWORD}
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD",
                ]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s
        networks:
            - laravel

    mailpit:
        image: axllent/mailpit:v1.21
        container_name: laravel_mailpit
        restart: unless-stopped
        ports:
            - "127.0.0.1:8025:8025" # bandeja: http://localhost:8025
        networks:
            - laravel

volumes:
    mysql_data:
    app_vendor:
    app_public:
    app_storage:

networks:
    laravel:
        driver: bridge
